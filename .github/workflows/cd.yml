name: CD

on:
  push:
    branches:
      - main

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Actualizar versión
        run: |
          echo "" >> README.md
          echo "AppVersion-2" >> README.md

  validate-prod:
    runs-on: self-hosted
    needs: update-version

    steps:
      - name: Validar PROD_TOKEN
        shell: powershell
        run: |
          if ("${{ secrets.PROD_TOKEN }}" -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Token correcto"
          }
          else {
            Write-Error "Token incorrecto"
          }